services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: beehive_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: beehive_simulator
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      HIVE_IDS: "hive-01,hive-02"
      TICK_SECONDS: 5
      SIM_MINUTES_PER_TICK: 15
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: beehive_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?copy .env.example to .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?copy .env.example to .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?copy .env.example to .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?copy .env.example to .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?copy .env.example to .env}
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  nodered:
    build: ./nodered
    container_name: beehive_nodered
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-Europe/Rome}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:?copy .env.example to .env}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?copy .env.example to .env}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?copy .env.example to .env}
    volumes:
      - ./nodered/data:/data
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config: