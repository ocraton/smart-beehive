services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: beehive_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto_data: